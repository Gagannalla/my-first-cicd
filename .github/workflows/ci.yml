
name: Multi Stage CI CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: '3.12'

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build artifact
        run: |
          mkdir -p build
          cp app.py build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-application
          path: build/

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: pip install pytest

      - name: Run Python tests
        run: python -m pytest -v

  deploy_dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: test
    environment: dev

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-application
          path: deployment/

      - name: Read repository variable
        run: |
          echo "Application environment: $APP_ENVIRONMENT"
        env:
          APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}

      - name: Verify repository secret
        run: |
          if [ -n "$DEMO_API_TOKEN" ]; then
            echo "Demo secret is available."
          else
            echo "Demo secret is missing."
            exit 1
          fi
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}

      - name: Simulate DEV deployment
        run: |
          echo "Deploying to DEV..."
          ls -l deployment/

  deploy_qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: deploy_dev
    environment: qa

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-application
          path: deployment/

      - name: Simulate QA deployment
        run: |
          echo "Deploying to QA..."
          ls -l deployment/

  deploy_prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy_qa
    environment: prod

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-application
          path: deployment/

      - name: Simulate PROD deployment
        run: |
          echo "Deploying to PROD..."
          ls -l deployment/
