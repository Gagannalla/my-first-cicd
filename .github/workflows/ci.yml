
name: Multi Stage CI CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: '3.12'

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build artifact
        run: |
          mkdir -p build
          cp app.py build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-application
          path: build/

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: pip install pytest

      - name: Run Python tests
        run: python -m pytest -v

  deploy:
    name: Simulate Azure App Service Deployment
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-application
          path: deployment/

      - name: Simulate App Service deployment
        run: |
          echo "Preparing application for Azure App Service..."
          echo "Target runtime: Python ${{ env.PYTHON_VERSION }}"
          echo "Application files:"
          ls -l deployment/
          echo "Simulated deployment completed successfully!"
